# Compila el portafolio y lo publica en GitHub Pages cada vez que se sube algo a main.
# En Settings → Pages, «Source» tiene que estar en «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # También se puede lanzar a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación cada vez: si llega otra, espera a que termine la que está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # El flujo no sube nada al repositorio: no necesita guardar las credenciales
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Comprueba los tipos y genera dist/
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
